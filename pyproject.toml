[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jerusalem-weather-mcp"
version = "0.1.0"
description = "An MCP server for Jerusalem's seven-day weather forecast"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.9,<2",
    "truststore>=0.10,<1",
]

[project.scripts]
jerusalem-weather-mcp = "jerusalem_weather_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
